[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-scraper"
version = "0.1.0"
description = "Parallel Google Places API placeId discovery + deep metadata scraper for Google Maps"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "tenacity>=8.2",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "filelock>=3.13",
    "python-json-logger>=2.0",
    "rich>=13.7",
    "questionary>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "requests>=2.31",
    # Transitive: the vendored extractor's gdrive_upload imports these at module load.
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]

[project.scripts]
parallel-scraper = "parallel_scraper.cli:main"
parallel-scraper-web = "parallel_scraper.web.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
